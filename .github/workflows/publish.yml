name: Update and publish Sheffield mosque times

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sheffield-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build website and collect mosque times
        run: |
          mkdir -p static public/data
          cp index.html styles.css app.js static/
          cp index.html styles.css app.js public/
          touch public/.nojekyll
          python - <<'PY'
          import json
          from pathlib import Path
          from app import build_payload
          data = build_payload()
          Path('public/data/mosques.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print('Mosque statuses:', [(m['id'], m['status']) for m in data['mosques']])
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages files
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
